<!DOCTYPE html>
<html>
<head>
    <title>Background Properties</title>

    <style>
        body {
            /* Background Color */
            background-color: lightblue;

            /* Background Image */
            background-image: url("https://media.gettyimages.com/id/2268299463/photo/royal-challengers-bengalurus-indian-cricket-player-virat-kohli-celebrates-after-scoring-a.jpg?s=612x612&w=gi&k=20&c=e1fdhXqR62yGxKmGVPM7HEYUrLPjdXFtu4xcYxvPW9s=");

            /* Prevent image from repeating */
            background-repeat: no-repeat;

            /* Image stays fixed while scrolling */
            background-attachment: fixed;

            /* Position the image at the center */
            background-position: center;

            /* Make the image cover the entire screen */
            background-size: cover;

        
    </style>
</head>

<body>

    <h1>Background Properties Example</h1>
    <p>
        This page uses:
        <br>✔ Background Color
        <br>✔ Background Image
        <br>✔ Background Repeat
        <br>✔ Background Attachment
        <br>✔ Background Position
        <br>✔ Background Size
    </p>

</body>
</html>
