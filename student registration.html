<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <form>
        <center>
            <h1>Student Registration Form</h1> </center>
            <hr><br>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Enter your name"><br><br>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email"><br><br>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password"><br><br>

            <label>Gender:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male">Male</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female">Female</label><br><br>

            <label>Skill:</label>
            <input type="checkbox" id="html" name="skill" value="html">
            <label for="html">HTML</label>
            <input type="checkbox" id="css" name="skill" value="css">
            <label for="css">CSS</label>
            <input type="checkbox" id="js" name="skill" value="js">
            <label for="js">JavaScript</label><br><br>

            <label for="city">City:</label>
            <select id="city" name="city">
                <option value="">Select City</option>
                <option value="Bangalore">Bengalore</option>
                <option value="chennai">Chennai</option>
                <option value="coimbatore">Coimbatore</option>
                <option value="madurai">Madurai</option>
            </select><br><br>

            <input type="submit" value="Submit">
        
    </form>
</body>
</html>
