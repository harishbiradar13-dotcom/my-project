<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #parent{
        height: 800px;
        
        display: flex;
        justify-content: space-evenly;
        align-items: center;

        background-image: url("https://images.unsplash.com/photo-1540747913346-19e32dc3e97e?fm=jpg&q=60&w=3000&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8Y3JpY2tldCUyMHN0YWRpdW18ZW58MHx8MHx8fDA%3D");
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-position: center;
        background-size: cover;
        
        }
        #child1,#child2,#child3{
            height: 200px;
            width: 200px;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
        }
        #img1{
            height: 200px;
            width: 200px;
            border-radius: 30px;
            transition: 0.5s;
            box-shadow: 2px 8px 20px black;
        
        }
        #img1:hover{
            transform: scale(2);
            box-shadow: 2px 8px 20px white;
        }
    </style>
</head>
<body>
    
    <div id="parent">
        <div id="child1">
            <img 
            id="img1"
            src="https://static.india.com/wp-content/uploads/2020/12/BCCI-Logo.jpg?impolicy=Medium_Resize&w=1200&h=800" alt="">
        </div>
        <div id="child2">
            <img 
            id="img1"
            src="https://www.livemint.com/lm-img/img/2024/05/29/960x540/T20-world-cup-trophy-shiny_1668317184680_1716983158186.png" alt="">
        </div>
        <div id="child3">
            <img 
            id="img1"
            src="https://upload.wikimedia.org/wikipedia/bn/d/d3/%E0%A6%87%E0%A6%82%E0%A6%B2%E0%A7%8D%E0%A6%AF%E0%A6%BE%E0%A6%A8%E0%A7%8D%E0%A6%A1_%E0%A6%95%E0%A7%8D%E0%A6%B0%E0%A6%BF%E0%A6%95%E0%A7%87%E0%A6%9F_%E0%A6%A6%E0%A6%B2%E0%A7%87%E0%A6%B0_%E0%A6%B2%E0%A7%8B%E0%A6%97%E0%A7%8B.svg" alt="">
        </div>
    </div>
</body>
</html>
